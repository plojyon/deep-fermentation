[project]
name = "mehurcki"
version = "0.1.0"
description = "Zvočni detektor mehurčkov"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=25.12.0",
    "fire>=0.7.1",
    "flake8-pyproject>=1.2.4",
    "ipykernel>=7.1.0",
    "isort>=7.0.0",
    "joblib>=1.5.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pyqt6>=6.10.1",
    "pywavelets>=1.9.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "torch>=2.12.0",
    "tqdm>=4.67.1",
]

[tool.black]
line-length = 100

[tool.flake8]
max-line-length = 100
